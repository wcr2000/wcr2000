<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="AI Factory: the last 14 days of contributions ride a conveyor belt">
<style>
  .crate { animation: ride 28s linear infinite; }
  @keyframes ride { from { transform: translateX(-80px) } to { transform: translateX(1220px) } }
  .spin { animation: spin 1.2s linear infinite; transform-origin: 0 0 }
  @keyframes spin { to { transform: rotate(360deg) } }
  .arm { animation: stamp 3.5s ease-in-out infinite }
  @keyframes stamp { 0%,60%,100% { transform: translateY(0) } 70% { transform: translateY(32px) } 80% { transform: translateY(26px) } }
  .led { animation: led 3.5s ease-in-out infinite }
  @keyframes led { 0%,60%,100% { fill: #171e2e } 70%,80% { fill: #f39a5b } }
  .smoke { animation: smoke 5s ease-out infinite; opacity: 0 }
  @keyframes smoke { 0% { transform: translate(0,0) scale(.6); opacity: 0 } 20% { opacity: .55 } 100% { transform: translate(-30px,-60px) scale(1.8); opacity: 0 } }
  .screen { animation: flicker 6s steps(1) infinite }
  @keyframes flicker { 0%,100% { opacity: 1 } 92% { opacity: .75 } }
</style>
<rect width="1200" height="380" rx="22" fill="#0f1420"/>
<rect x="0" y="320" width="1200" height="60" fill="#171e2e"/>

<!-- chimney + smoke -->
<rect x="1080" y="12" width="40" height="80" fill="#4b5468"/>
<circle cx="1100" cy="10" r="12" fill="#7f8799" class="smoke"/>
<circle cx="1100" cy="10" r="12" fill="#7f8799" class="smoke" style="animation-delay:1.7s"/>
<circle cx="1100" cy="10" r="12" fill="#7f8799" class="smoke" style="animation-delay:3.4s"/>

