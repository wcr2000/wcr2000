  <text x="20" y="64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e7eaf0">last 14 days  <tspan font-weight="700">249</tspan> contributions</text>
  <text x="20" y="88" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e7eaf0">busiest day   <tspan font-weight="700">112</tspan></text>
  <text x="20" y="112" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e7eaf0">this year     <tspan font-weight="700">946</tspan></text>
</g>

